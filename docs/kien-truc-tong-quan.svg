  <rect x="85"  y="535" width="175" height="80" rx="6" fill="#ffffff" stroke="#e8b095" stroke-width="1.5"/>
  <rect x="282" y="535" width="175" height="80" rx="6" fill="#ffffff" stroke="#e8b095" stroke-width="1.5"/>
  <rect x="479" y="535" width="175" height="80" rx="6" fill="#ffffff" stroke="#e8b095" stroke-width="1.5"/>
