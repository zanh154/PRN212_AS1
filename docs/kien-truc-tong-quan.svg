  <text x="815" y="525" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">MySQL 8.4</text>
  <text x="815" y="542" text-anchor="middle" font-size="10.5" fill="#64748b">Aiven · TLS</text>
  <line x1="684" y1="506" x2="749" y2="506" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="749" y1="536" x2="684" y2="536" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowDash)"/>

  <path d="M 753 596 a 62 17 0 0 1 124 0 l 0 60 a 62 17 0 0 1 -124 0 z" fill="#ffffff" stroke="#334155" stroke-width="2"/>
