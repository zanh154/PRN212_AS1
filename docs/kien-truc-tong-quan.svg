    </marker>
  </defs>

  <rect x="-80" y="0" width="1060" height="700" fill="#ffffff"/>
  <text x="370" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">AssignmentPRN System Architecture</text>

  <!-- Presentation -->
  <rect x="60" y="60" width="620" height="150" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="370" y="88" text-anchor="middle" font-size="16" font-weight="700" fill="#1d4ed8">Presentation Layer (WebMVC)</text>
  <rect x="85"  y="105" width="175" height="80" rx="6" fill="#ffffff" stroke="#93b4e8" stroke-width="1.5"/>
  <rect x="282" y="105" width="175" height="80" rx="6" fill="#ffffff" stroke="#93b4e8" stroke-width="1.5"/>
