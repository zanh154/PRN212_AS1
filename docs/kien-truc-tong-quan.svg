  <text x="172" y="376" text-anchor="middle" font-size="10.5" fill="#64748b">Auth · Course · Exam · Question</text>
  <text x="369" y="357" text-anchor="middle" font-size="15" font-weight="600" fill="#14532d">Business rules</text>
  <text x="369" y="376" text-anchor="middle" font-size="10.5" fill="#64748b">Scheduling · Picking · Scoring</text>
  <text x="566" y="357" text-anchor="middle" font-size="15" font-weight="600" fill="#14532d">Interfaces</text>
  <text x="566" y="376" text-anchor="middle" font-size="10.5" fill="#64748b">Request/Response DTO · Enums</text>

