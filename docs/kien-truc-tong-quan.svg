  <text x="815" y="650" text-anchor="middle" font-size="10.5" fill="#64748b">wwwroot/materials</text>
  <line x1="684" y1="614" x2="749" y2="614" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="749" y1="644" x2="684" y2="644" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowDash)"/>

