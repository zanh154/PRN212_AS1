  <line x1="430" y1="273" x2="430" y2="214" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowDash)"/>
  <line x1="320" y1="427" x2="320" y2="486" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="430" y1="488" x2="430" y2="429" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowDash)"/>

  <!-- Luu tru ngoai -->
  <path d="M 753 488 a 62 17 0 0 1 124 0 l 0 60 a 62 17 0 0 1 -124 0 z" fill="#ffffff" stroke="#334155" stroke-width="2"/>
