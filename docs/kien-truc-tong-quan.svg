  <rect x="85"  y="320" width="175" height="80" rx="6" fill="#ffffff" stroke="#8fd3a7" stroke-width="1.5"/>
  <rect x="282" y="320" width="175" height="80" rx="6" fill="#ffffff" stroke="#8fd3a7" stroke-width="1.5"/>
  <rect x="479" y="320" width="175" height="80" rx="6" fill="#ffffff" stroke="#8fd3a7" stroke-width="1.5"/>
