  <text x="369" y="572" text-anchor="middle" font-size="15" font-weight="600" fill="#7c3a1d">AivesDbContext</text>
  <text x="369" y="591" text-anchor="middle" font-size="10.5" fill="#64748b">EF Core 9 · Pomelo MySQL</text>
  <text x="566" y="572" text-anchor="middle" font-size="15" font-weight="600" fill="#7c3a1d">Entity Models</text>
  <text x="566" y="591" text-anchor="middle" font-size="10.5" fill="#64748b">12 entity: User · Course · Exam</text>

