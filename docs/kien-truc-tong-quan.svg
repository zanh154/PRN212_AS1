  <rect x="730" y="80" width="215" height="110" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="837" y="108" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Legends</text>
  <line x1="750" y1="135" x2="810" y2="135" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="822" y="140" font-size="14" fill="#334155">request</text>
  <line x1="750" y1="167" x2="810" y2="167" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowDash)"/>
  <text x="822" y="172" font-size="14" fill="#334155">response</text>

  <!-- Ghi chu ben trai -->
  <text x="-72" y="128" font-size="14" font-weight="600" fill="#475569">MVC</text>
  <text x="-72" y="148" font-size="14" font-weight="600" fill="#475569">Web App</text>
  <line x1="-8" y1="138" x2="54" y2="138" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowDash)"/>
  <path d="M 52 282 C 42 282 42 292 42 302 L 42 448 C 42 460 34 462 26 462 C 34 462 42 464 42 476 L 42 620 C 42 630 42 638 52 638" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="-40" y="466" text-anchor="middle" font-size="14" font-weight="600" fill="#475569">.dll</text>
